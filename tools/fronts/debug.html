<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fronten-Debug</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Die Debug-Seite ist Synoptix (index.html) mit ?debug=1: gleiche Oberfläche,
     dazu Werkzeuge für die Abstimmung der Automatik. Alte Links mit
     ?fixture=…&step=… bleiben gültig. -->
<script>
  const q = new URLSearchParams(location.search);
  q.set("debug", "1");
  location.replace(`index.html?${q}`);
</script>
</head>
<body><a href="index.html?debug=1">Fronten-Debug öffnen</a></body>
</html>
