<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fronten-Debug</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #fff; color: #222; }
  #map { position: absolute; inset: 0 0 0 290px; }
  .leaflet-container { background: #fff; }
  #panel { position: absolute; inset: 0 auto 0 0; width: 290px; box-sizing: border-box; padding: 10px 12px; overflow-y: auto; border-right: 1px solid #ccc; }
  #panel h1 { font-size: 15px; margin: 0 0 6px; }
  #panel label { display: block; margin: 8px 0 2px; font-weight: 600; }
  #panel .row { display: flex; gap: 6px; align-items: center; }
  #panel input[type=text] { width: 100%; box-sizing: border-box; }
  #panel input[type=range] { flex: 1; }
  #meta, #hover { margin-top: 10px; padding: 6px; background: #f4f4f4; border-radius: 4px; white-space: pre; font: 12px ui-monospace, monospace; }
  #legend { margin-top: 8px; }
  #legend canvas { width: 100%; height: 14px; display: block; }
  #legend .ticks { display: flex; justify-content: space-between; font-size: 11px; }
  .chk { font-weight: 400 !important; }
  .params { display: grid; grid-template-columns: 1fr 5em; gap: 3px 6px; align-items: center; margin: 4px 0 4px 20px; }
  .params input { width: 100%; box-sizing: border-box; }
  @media (max-width: 700px) {
    #panel { inset: auto 0 0 0; width: auto; height: 45%; border-right: 0; border-top: 1px solid #ccc; }
    #map { inset: 0 0 45% 0; }
  }
</style>
</head>
<body>
<div id="panel">
  <h1>Fronten-Debug (850 hPa)</h1>
  <label for="fixture">Fixture</label>
  <div class="row"><input id="fixture" type="text"><button id="load">Laden</button></div>

  <label for="fieldSel">Schattierung</label>
  <select id="fieldSel">
    <option value="thE">θe [°C]</option>
    <option value="thW">θw [°C]</option>
    <option value="T">T [°C]</option>
    <option value="grad">|∇θw| [K/100 km]</option>
    <option value="tfp">TFP [K/(100 km)²]</option>
  </select>

  <label for="sigma">Glättung σ: <span id="sigmaVal"></span> km</label>
  <div class="row"><input id="sigma" type="range" min="0" max="300" step="10" value="120"></div>

  <label for="isoSel">Isolinien</label>
  <div class="row">
    <select id="isoSel">
      <option value="">keine</option>
      <option value="thE" selected>θe</option>
      <option value="thW">θw</option>
    </select>
    alle <input id="isoStep" type="number" value="3" min="0.5" step="0.5" style="width:4em"> K
  </div>

  <label class="chk"><input id="wind" type="checkbox"> Windpfeile 850 hPa</label>
  <label class="chk"><input id="mask" type="checkbox" checked> Maske „unter Grund“</label>

  <label class="chk"><input id="fronts" type="checkbox" checked> <b>Fronten (TFP)</b></label>
  <div class="params">
    <span>K1 TFP</span><input id="k1" type="number" step="0.05">
    <span>K2 |∇θw|</span><input id="k2" type="number" step="0.1">
    <span>min. Länge km</span><input id="minLen" type="number" step="50">
    <span>Wind kalt/warm m/s</span><input id="windMin" type="number" step="0.5">
  </div>
  <label class="chk"><input id="cand" type="checkbox"> Kandidaten ohne Masken (grau)</label>
  <div class="row"><button id="export">GeoJSON speichern</button> <span id="nFronts"></span></div>

  <label for="opacity">Deckkraft</label>
  <div class="row"><input id="opacity" type="range" min="0" max="1" step="0.05" value="0.75"></div>

  <div id="legend"><canvas width="300" height="14"></canvas><div class="ticks"></div></div>
  <div id="meta"></div>
  <div id="hover">Maus über die Karte …</div>
</div>
<div id="map"></div>

<script type="module">
import { thetaFields } from "../../src/fronts/thermo.js";
import { gaussianSmooth, gradient, isolineSegments, chainSegments } from "../../src/fronts/grid.js";
import { detectFronts, frontFields, DETECT_DEFAULTS } from "../../src/fronts/detect.js";

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
$("fixture").value = params.get("fixture") || "fixtures/icon_eu_850_2026100900_an.json";
$("k1").value = DETECT_DEFAULTS.k1; $("k2").value = DETECT_DEFAULTS.k2;
$("minLen").value = DETECT_DEFAULTS.minLengthKm; $("windMin").value = DETECT_DEFAULTS.windMin;

// Farbskala angelehnt an die gängigen θe-Karten (violett kalt -> rot warm).
const STOPS = ["#6a1b9a", "#d81bd0", "#2a2ad0", "#3a78ff", "#6cc8ff", "#3fd0b0",
  "#3cbf3c", "#a6e03c", "#ffff3c", "#f5a623", "#e0601e", "#c0201e", "#7a0d3c"];
const GRAD_STOPS = ["#ffffff", "#fff3b0", "#ffc04d", "#f46d25", "#c4161c", "#5a0a2a"];
const SCALES = {
  thE: { min: -9, max: 81, step: 3, stops: STOPS },
  thW: { min: -12, max: 24, step: 1, stops: STOPS },
  T: { min: -24, max: 24, step: 2, stops: STOPS },
  grad: { min: 0, max: 6, step: 0.5, stops: GRAD_STOPS },
  tfp: { min: -1, max: 1, step: 0.1, stops: ["#2166ac", "#92c5de", "#f7f7f7", "#f4a582", "#b2182b"] },
};
const hex = (h) => [1, 3, 5].map((o) => parseInt(h.slice(o, o + 2), 16));
function colorAt(scale, value) {
  const q = Math.floor(value / scale.step) * scale.step; // Bänder wie in Druckkarten
  const f = Math.min(1, Math.max(0, (q - scale.min) / (scale.max - scale.min)));
  const x = f * (scale.stops.length - 1), i = Math.min(scale.stops.length - 2, Math.floor(x));
  const a = hex(scale.stops[i]), b = hex(scale.stops[i + 1]), t = x - i;
  return a.map((c, n) => Math.round(c + t * (b[n] - c)));
}

const map = L.map("map", { preferCanvas: true }).setView([52, 8], 4);
map.createPane("field").style.zIndex = 350;
map.createPane("geo").style.zIndex = 410;
map.createPane("lines").style.zIndex = 420;

// Küsten und Ländergrenzen als Vektorlinien (Natural Earth 1:50 Mio. via
// world-atlas) statt Kachelkarte -- kein API-Key, und die Felder bleiben wie
// auf einer Wetterkarte gut lesbar.
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json")
  .then((r) => r.json())
  .then((topo) => {
    const obj = topo.objects.countries;
    const style = (weight) => ({ pane: "geo", color: "#000", weight, interactive: false });
    L.geoJSON(topojson.mesh(topo, obj, (a, b) => a === b), { style: style(1) }).addTo(map);
    L.geoJSON(topojson.mesh(topo, obj, (a, b) => a !== b), { style: { ...style(0.6), dashArray: "3 3" } }).addTo(map);
    map.attributionControl.addAttribution("Grenzen: Natural Earth");
  })
  .catch((err) => console.warn("Grenzen nicht geladen:", err));

let F = null, G = null, TH = null, overlay = null, isoLayer = null, windLayer = null, derived = null;
let frontLayer = null, fronts = null, FF = null;

async function load() {
  const url = $("fixture").value;
  const resp = await fetch(url);
  if (!resp.ok) { $("meta").textContent = `Fehler ${resp.status}: ${url}`; return; }
  F = await resp.json();
  for (const k of ["T", "q", "u", "v", "psfc"]) F[k] = Float32Array.from(F[k], (x) => (x == null ? NaN : x));
  G = { nx: F.nx, ny: F.ny, lat0: F.lat0, lon0: F.lon0, res: F.res };
  TH = thetaFields(F);
  $("meta").textContent = [
    `${F.model}  ${F.pressure} hPa`,
    `gültig    ${F.validTime} UTC`,
    `Lauf (bei Abruf) ${F.lastRunAtFetch?.slice(0, 16).replace("T", " ") ?? "?"}`,
    `Raster    ${F.res}°  ${F.nx}×${F.ny}`,
  ].join("\n");
  params.set("fixture", url); history.replaceState(null, "", `?${params}`);
  recompute();
}

function recompute() {
  if (!F) return;
  const sigma = Number($("sigma").value);
  $("sigmaVal").textContent = sigma;
  const thE = gaussianSmooth(TH.thE, G, sigma);
  const thW = gaussianSmooth(TH.thW, G, sigma);
  const T = gaussianSmooth(F.T, G, sigma);
  derived = {
    thE: thE.map((x) => x - 273.15), thW: thW.map((x) => x - 273.15), T: T.map((x) => x - 273.15),
    grad: gradient(thW, G).mag,
  };
  runDetection(false);
  derived.tfp = FF.TFP;
  drawField(); drawIsolines(); drawWind(); drawFronts();
}

// Raster in Web-Mercator auflösen, damit das Bild-Overlay lagerichtig ist
// (Leaflet streckt ein ImageOverlay linear in Projektionskoordinaten).
function drawField() {
  const key = $("fieldSel").value, scale = SCALES[key], fld = derived[key];
  const { nx, ny, lat0, lon0, res } = G;
  const south = lat0 - res / 2, north = lat0 + (ny - 0.5) * res;
  const west = lon0 - res / 2, east = lon0 + (nx - 0.5) * res;
  const merc = (lat) => Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI) / 360));
  const imerc = (y) => (360 / Math.PI) * Math.atan(Math.exp(y)) - 90;
  const W = nx * 4, H = ny * 6, ys = merc(south), yn = merc(north);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(W, H);
  const showMask = $("mask").checked;
  for (let py = 0; py < H; py++) {
    const lat = imerc(yn - ((py + 0.5) / H) * (yn - ys));
    const j = Math.min(ny - 1, Math.max(0, Math.round((lat - lat0) / res)));
    for (let px = 0; px < W; px++) {
      const lon = west + ((px + 0.5) / W) * (east - west);
      const i = Math.min(nx - 1, Math.max(0, Math.round((lon - lon0) / res)));
      const k = j * nx + i, o = (py * W + px) * 4, v = fld[k];
      if (F.below[k]) {
        if (showMask) { img.data.set([110, 110, 110, 170], o); }
        continue;
      }
      if (!Number.isFinite(v)) continue;
      const [r, g, b] = colorAt(scale, v);
      img.data.set([r, g, b, 255], o);
    }
  }
  ctx.putImageData(img, 0, 0);
  overlay?.remove();
  overlay = L.imageOverlay(cv.toDataURL(), [[south, west], [north, east]], {
    pane: "field", opacity: Number($("opacity").value),
  }).addTo(map);
  overlay.getElement().style.imageRendering = "pixelated";
  drawLegend(scale);
}

function drawLegend(scale) {
  const cv = $("legend").querySelector("canvas"), ctx = cv.getContext("2d");
  for (let x = 0; x < cv.width; x++) {
    const v = scale.min + (x / cv.width) * (scale.max - scale.min);
    ctx.fillStyle = `rgb(${colorAt(scale, v).join(",")})`; ctx.fillRect(x, 0, 1, cv.height);
  }
  const n = 6, t = [];
  for (let s = 0; s <= n; s++) t.push(`<span>${+(scale.min + (s / n) * (scale.max - scale.min)).toFixed(1)}</span>`);
  $("legend").querySelector(".ticks").innerHTML = t.join("");
}

function drawIsolines() {
  isoLayer?.remove(); isoLayer = null;
  const key = $("isoSel").value, step = Number($("isoStep").value);
  if (!key || !(step > 0)) return;
  const fld = derived[key];
  let lo = Infinity, hi = -Infinity;
  for (const x of fld) if (Number.isFinite(x)) { lo = Math.min(lo, x); hi = Math.max(hi, x); }
  isoLayer = L.layerGroup();
  for (let lev = Math.ceil(lo / step) * step; lev <= hi; lev += step) {
    const segs = isolineSegments(fld, G, lev);
    if (segs.length) L.polyline(segs, { pane: "lines", color: "#333", weight: 0.8, interactive: false }).addTo(isoLayer);
  }
  isoLayer.addTo(map);
}

function drawWind() {
  windLayer?.remove(); windLayer = null;
  if (!$("wind").checked) return;
  windLayer = L.layerGroup();
  const { nx, ny, lat0, lon0, res } = G, every = 3, s = 0.04; // Grad je m/s
  const lines = [];
  for (let j = 0; j < ny; j += every) for (let i = 0; i < nx; i += every) {
    const k = j * nx + i, u = F.u[k], v = F.v[k];
    if (!Number.isFinite(u) || F.below[k]) continue;
    const lat = lat0 + j * res, lon = lon0 + i * res, c = Math.cos((lat * Math.PI) / 180);
    const tip = [lat + v * s, lon + (u * s) / c];
    const ang = Math.atan2(v, u / 1), hl = 0.35 * Math.hypot(u, v) * s;
    const head = (da) => [tip[0] - hl * Math.sin(ang + da), tip[1] - (hl * Math.cos(ang + da)) / c];
    lines.push([[lat, lon], tip], [head(0.5), tip, head(-0.5)]);
  }
  L.polyline(lines, { pane: "lines", color: "#000", weight: 1, interactive: false }).addTo(windLayer);
  windLayer.addTo(map);
}

function detectOpts() {
  return {
    sigmaKm: Number($("sigma").value), k1: Number($("k1").value), k2: Number($("k2").value),
    minLengthKm: Number($("minLen").value), windMin: Number($("windMin").value),
  };
}

function runDetection(redraw = true) {
  if (!F) return;
  const o = detectOpts();
  FF = frontFields(F, o);
  fronts = detectFronts(F, o);
  $("nFronts").textContent = `${fronts.features.length} Linien`;
  if (redraw) { derived.tfp = FF.TFP; drawFronts(); if ($("fieldSel").value === "tfp") drawField(); }
}

// Frontsymbole in km-Geometrie um einen Punkt (lat, lon): t = Tangente,
// nrm = Normale zur Symbolseite, beide als Einheitsvektoren (Ost, Nord).
const KM_PER_DEG = 111.2;
const offset = (p, dxKm, dyKm) => [p[0] + dyKm / KM_PER_DEG, p[1] + dxKm / (KM_PER_DEG * Math.cos((p[0] * Math.PI) / 180))];
function triangle(p, t, nrm, size) {
  return [offset(p, -t[0] * size * 0.6, -t[1] * size * 0.6), offset(p, t[0] * size * 0.6, t[1] * size * 0.6), offset(p, nrm[0] * size, nrm[1] * size)];
}
function semicircle(p, t, nrm, size) {
  const r = size * 0.55, pts = [];
  for (let a = 0; a <= Math.PI + 1e-9; a += Math.PI / 10) {
    pts.push(offset(p, r * (Math.cos(a) * t[0] + Math.sin(a) * nrm[0]), r * (Math.cos(a) * t[1] + Math.sin(a) * nrm[1])));
  }
  return pts;
}

function drawFronts() {
  frontLayer?.remove(); frontLayer = L.layerGroup();
  if ($("cand").checked && FF) {
    const segs = chainSegments(isolineSegments(FF.F, FF.g, 0));
    L.polyline(segs, { pane: "lines", color: "#777", weight: 0.8, interactive: false }).addTo(frontLayer);
  }
  if ($("fronts").checked && fronts) {
    const RED = "#d7191c", BLUE = "#1f4fd8";
    for (const f of fronts.features) {
      const pr = f.properties, ll = f.geometry.coordinates.map(([lo, la]) => [la, lo]);
      const tip = `${pr.front_type}  ${pr.length_km} km<br>|∇θw| ${pr.gradient}  TFP ${pr.tfp}  Querwind ${pr.cross_wind} m/s`;
      const base = { pane: "lines", weight: 3 };
      if (pr.front_type === "stationary") {
        L.polyline(ll, { ...base, color: RED }).bindTooltip(tip).addTo(frontLayer);
        L.polyline(ll, { ...base, color: BLUE, dashArray: "14 14", interactive: false }).addTo(frontLayer);
      } else {
        L.polyline(ll, { ...base, color: pr.front_type === "cold" ? BLUE : RED }).bindTooltip(tip).addTo(frontLayer);
      }
      // Symbole alle ~250 km, Seite aus motion_side bzw. warm_side.
      const sideSign = (side) => (side === "left" ? 1 : -1);
      let acc = 125, n = 0;
      for (let m = 1; m < ll.length; m++) {
        const a = ll[m - 1], b = ll[m], c = Math.cos((a[0] * Math.PI) / 180);
        const dx = (b[1] - a[1]) * KM_PER_DEG * c, dy = (b[0] - a[0]) * KM_PER_DEG, d = Math.hypot(dx, dy);
        if (!(d > 0)) continue;
        const t = [dx / d, dy / d], left = [-t[1], t[0]];
        for (; acc <= d; acc += 250, n++) {
          const p = [a[0] + (b[0] - a[0]) * (acc / d), a[1] + (b[1] - a[1]) * (acc / d)];
          let kind = pr.front_type, side = pr.motion_side;
          if (kind === "stationary") {
            kind = n % 2 ? "warm" : "cold";
            side = kind === "cold" ? pr.warm_side : (pr.warm_side === "left" ? "right" : "left");
          }
          const s = sideSign(side), nrm = [left[0] * s, left[1] * s];
          const poly = kind === "cold" ? triangle(p, t, nrm, 55) : semicircle(p, t, nrm, 55);
          L.polygon(poly, { pane: "lines", stroke: false, fillColor: kind === "cold" ? BLUE : RED, fillOpacity: 1, interactive: false }).addTo(frontLayer);
        }
        acc -= d;
      }
    }
  }
  frontLayer.addTo(map);
}

function exportGeoJSON() {
  if (!fronts) return;
  const blob = new Blob([JSON.stringify(fronts, null, 1)], { type: "application/geo+json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `fronts_${F.model}_${F.pressure}_${F.validTime.replace(/[-:]/g, "").slice(0, 11)}.geojson`;
  a.click();
  URL.revokeObjectURL(a.href);
}

map.on("mousemove", (e) => {
  if (!F) return;
  const { nx, ny, lat0, lon0, res } = G;
  const j = Math.round((e.latlng.lat - lat0) / res), i = Math.round((e.latlng.lng - lon0) / res);
  if (i < 0 || j < 0 || i >= nx || j >= ny) { $("hover").textContent = "außerhalb"; return; }
  const k = j * nx + i, f1 = (x) => (Number.isFinite(x) ? x.toFixed(1) : "–");
  const ff = Math.hypot(F.u[k], F.v[k]);
  const dd = (Math.atan2(-F.u[k], -F.v[k]) * 180 / Math.PI + 360) % 360;
  $("hover").textContent = [
    `${(lat0 + j * res).toFixed(2)}° N  ${(lon0 + i * res).toFixed(2)}° E`,
    `T      ${f1(derived.T[k])} °C`,
    `θe     ${f1(derived.thE[k])} °C`,
    `θw     ${f1(derived.thW[k])} °C`,
    `|∇θw|  ${f1(derived.grad[k])} K/100 km`,
    `TFP    ${Number.isFinite(FF?.TFP[k]) ? FF.TFP[k].toFixed(2) : "–"}  Maske ${FF?.mask[k] ? "ja" : "nein"}`,
    `Wind   ${Number.isFinite(ff) ? `${dd.toFixed(0)}° / ${(ff * 1.94384).toFixed(0)} kt` : "–"}`,
    `p_sfc  ${f1(F.psfc[k])} hPa${F.below[k] ? "  (unter Grund)" : ""}`,
  ].join("\n");
});

$("load").onclick = load;
for (const id of ["k1", "k2", "minLen", "windMin"]) $(id).onchange = () => runDetection();
$("fronts").onchange = drawFronts;
$("cand").onchange = drawFronts;
$("export").onclick = exportGeoJSON;
$("sigma").oninput = recompute;
$("fieldSel").onchange = drawField;
$("mask").onchange = drawField;
$("isoSel").onchange = drawIsolines;
$("isoStep").onchange = drawIsolines;
$("wind").onchange = drawWind;
$("opacity").oninput = () => overlay?.setOpacity(Number($("opacity").value));
load();
</script>
</body>
</html>
