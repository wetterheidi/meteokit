<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synoptix</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #fff; color: #222; }
  #map { position: absolute; inset: 0 0 0 340px; }
  .leaflet-container { background: #fff; }
  #panel { position: absolute; inset: 0 auto 0 0; width: 340px; box-sizing: border-box; padding: 10px 12px; overflow-y: auto; border-right: 1px solid #ccc; }
  #panel h1 { font-size: 17px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  #panel h1 img { width: 22px; height: 22px; }
  #panel label { display: block; margin: 8px 0 2px; font-weight: 600; }
  #panel .head { margin: 14px 0 4px; font-weight: 700; border-top: 1px solid #e2e2e2; padding-top: 8px; }
  #panel .row { display: flex; gap: 6px; align-items: center; }
  #panel input[type=text] { width: 100%; box-sizing: border-box; }
  #panel input[type=range] { flex: 1; }
  #meta { margin-top: 10px; padding: 6px; background: #f4f4f4; border-radius: 4px; white-space: pre; font: 12px ui-monospace, monospace; }
  #legend { margin-top: 6px; }
  #legend canvas { width: 100%; height: 14px; display: block; }
  #legend .ticks { display: flex; justify-content: space-between; font-size: 11px; }
  #fieldName { font-weight: 400; color: #444; }
  .chk { font-weight: 400 !important; }
  .params { display: grid; grid-template-columns: 1fr 5em; gap: 3px 6px; align-items: center; margin: 6px 0 4px 18px; }
  .params input { width: 100%; box-sizing: border-box; }
  .note { font-size: 11px; color: #555; margin-top: 4px; }
  details { margin: 6px 0 2px; }
  summary { cursor: pointer; color: #333; }
  /* Schattierung: Knopfraster nach Themen */
  .fgroup { display: grid; grid-template-columns: 5.6em 1fr; gap: 4px; align-items: start; margin-bottom: 3px; }
  .fgroup .gname { font-size: 11px; color: #555; padding-top: 4px; }
  .fgroup .btns { display: flex; flex-wrap: wrap; gap: 3px; }
  .fbtn { font: 12px system-ui, sans-serif; padding: 2px 6px; border: 1px solid #bbb; background: #f7f7f7; border-radius: 4px; cursor: pointer; }
  .fbtn:hover { background: #eaeaea; }
  .fbtn.on { background: #1d3557; border-color: #1d3557; color: #fff; }
  /* Isolinien: eine Zeile je Größe */
  .iso { display: grid; grid-template-columns: 1fr 3.4em 2.8em 22px; gap: 4px; align-items: center; margin: 2px 0; }
  .iso label { margin: 0 !important; font-weight: 400 !important; }
  .iso input[type=number] { width: 100%; box-sizing: border-box; }
  .iso .unit { font-size: 11px; color: #555; }
  .swatch { width: 22px; height: 0; border-top: 2px solid #000; }
  #edCompare { margin-top: 6px; padding: 6px; background: #f4f4f4; border-radius: 4px; white-space: pre; font: 12px ui-monospace, monospace; }
  #edCompare:empty { display: none; }
  .cp { background: #fff; border: 2px solid #222; border-radius: 50%; box-sizing: border-box; cursor: move; }
  .cp:hover { background: #ffd400; }
  body:not(.debug) .debug-only { display: none !important; }
  /* Werte unter der Maus: Kasten auf der Karte */
  .hoverbox { background: rgba(255, 255, 255, 0.88); border: 1px solid #aaa; border-radius: 4px; font: 12px ui-monospace, monospace; }
  .hoverbox .hb-head { padding: 3px 6px; cursor: pointer; font: 600 12px system-ui, sans-serif; user-select: none; }
  .hoverbox pre { margin: 0; padding: 0 6px 5px; }
  .hoverbox.collapsed pre { display: none; }
</style>
</head>
<body>
<div id="panel">
  <h1><img src="favicon.svg" alt=""><span id="title">Synoptix</span></h1>
  <label for="fixture" title="„latest“ = neuester Termin der laufenden Analyse (Ablage live/ neben dieser Seite, mit ?live=… änderbar); archivierte Termine und Testfälle stehen in der Liste.">Daten</label>
  <div class="row"><input id="fixture" type="text" list="fixtures"><button id="load">Laden</button></div>
  <datalist id="fixtures">
    <option value="latest">Aktuelle Analyse (laufende Analyse, neuester Termin)</option>
    <option value="fixtures/icon_eu_2026-10-12.json.gz">12.10. Hoch Mitteleuropa, Tiefs Grönland und Baltikum (Blindtest)</option>
    <option value="fixtures/icon_eu_2026-10-10.json.gz">10.10. Finnland-Tief, Ostseewelle, Front über Frankreich</option>
    <option value="fixtures/icon_eu_2026-10-09.json.gz">08./09.10. Island-, Ostsee-, Ligurientief</option>
    <option value="fixtures/icon_eu_2026-10-08.json.gz">08.10. schleifende Front an den Alpen</option>
    <option value="fixtures/icon_eu_2026-10-06.json.gz">06.10. wellende Front über Großbritannien</option>
    <option value="fixtures/icon_eu_2026-10-05.json.gz">05.10. Testfall (Nordmeertief)</option>
  </datalist>
  <label class="chk" title="Zu ICON-EU die ICON-Global-Daten gleichen Namens laden und die Felder zusammensetzen (ICON-EU innen, ICON Global außen, Übergang 2,5°), wie im Betrieb."><input id="mergeGlobal" type="checkbox" checked> ICON Global außen</label>
  <div class="row" style="margin-top:6px">
    <select id="stepSel" title="Termin" style="flex:1"></select>
    <select id="presSel" title="Druckfläche"></select>
  </div>

  <div class="head">Schattierung <span id="fieldName"></span></div>
  <div id="fieldGrid" title="Tasten , und . schalten zurück bzw. vor"></div>
  <div id="legend"><canvas width="300" height="14"></canvas><div class="ticks"></div></div>
  <div class="row" style="margin-top:4px"><span class="note" style="margin:0">Deckkraft</span><input id="opacity" type="range" min="0" max="1" step="0.05" value="0.75"></div>

  <div class="head">Isolinien</div>
  <div id="isoList"></div>

  <div class="head">Wind</div>
  <label class="chk"><input id="wind" type="checkbox"> Windpfeile <span class="plev">850 hPa</span></label>
  <label class="chk"><input id="wind10" type="checkbox"> Windpfeile ~10 m</label>

  <div class="head"><label class="chk" style="margin:0; font-weight:700 !important"><input id="fronts" type="checkbox" checked> Fronten</label></div>
  <div id="nFronts" class="note"></div>
  <label class="chk debug-only" title="Kalt- und quasistationäre Fronten von der Lage in der Druckfläche zur warmen Seite verschieben, dorthin, wo Bodendruckrinne und Niederschlag am stärksten sind; Warmfronten bleiben."><input id="surface" type="checkbox" checked> Fronten in Bodenlage (sonst <span class="plev">850 hPa</span>)</label>
  <label class="chk"><input id="precipFronts" type="checkbox"> Fronten aus Niederschlagsachsen an Tiefs ohne TFP-Front (in Erprobung)</label>
  <label class="chk"><input id="inactive" type="checkbox"> Linien ohne Wetter zeigen (grau)</label>
  <label class="chk"><input id="ridges" type="checkbox"> Warmluftzungen (Rückenachsen Schichtdicke bzw. θw 700)</label>
  <label class="chk"><input id="kinks" type="checkbox"> Knicklinien der Isobaren (Achsen max. zyklonaler Krümmung, orange)</label>
  <label class="chk debug-only"><input id="cand" type="checkbox"> Kandidaten ohne Masken (grau)</label>
  <details>
    <summary>Einstellungen der Analyse</summary>
    <label for="sigma" class="chk" style="margin-left:18px">Glättung σ: <span id="sigmaVal"></span> km (Analyse und Schattierung)</label>
    <div class="row" style="margin-left:18px"><input id="sigma" type="range" min="0" max="300" step="10" value="90"></div>
    <div class="params">
      <span>K1 TFP</span><input id="k1" type="number" step="0.05">
      <span>K2 |∇θw|</span><input id="k2" type="number" step="0.1">
      <span>min. Länge km</span><input id="minLen" type="number" step="50">
      <span>Wind kalt/warm m/s</span><input id="windMin" type="number" step="0.5">
    </div>
  </details>
  <div class="row" style="margin-top:4px"><button id="export" title="Aktive und schwache Fronten der Automatik als GeoJSON herunterladen">GeoJSON speichern</button></div>

  <div class="head">Handanalyse</div>
  <div class="row">
    <select id="edType" style="flex:1" title="Typ der neuen bzw. ausgewählten Front">
      <option value="cold">Kaltfront</option>
      <option value="warm">Warmfront</option>
      <option value="occluded">Okklusion</option>
      <option value="stationary">quasistationär</option>
    </select>
    <label class="chk" style="margin:0"><input id="edWeak" type="checkbox"> schwach</label>
  </div>
  <div class="row" style="margin-top:4px; flex-wrap:wrap">
    <button id="edNew" title="Klicks setzen Punkte, Doppelklick oder Enter beendet, Esc bricht ab">Neue Front</button>
    <button id="edFlip" title="Symbole auf die andere Seite">Seite ⇄</button>
    <button id="edDel" title="Ausgewählte Front löschen (Entf)">Löschen</button>
    <button id="edUndo" title="Rückgängig (Strg/Cmd+Z)">↶</button>
  </div>
  <div class="row" style="margin-top:4px; flex-wrap:wrap">
    <button id="edImport" title="Aktive und schwache Fronten der Automatik als bearbeitbare Linien übernehmen">Automatik übernehmen</button>
    <button id="edClear">Alle löschen</button>
  </div>
  <div class="row" style="margin-top:4px; flex-wrap:wrap">
    <button id="edSave" title="Als GeoJSON herunterladen, dann nach tools/fronts/reference/ legen">Referenz speichern</button>
    <button id="edOpen">Datei laden …</button>
    <button id="edReset" title="Browser-Entwurf verwerfen und die Referenzdatei neu laden">Entwurf verwerfen</button>
    <input id="edFile" type="file" accept=".geojson,.json,application/geo+json" hidden>
  </div>
  <label class="chk"><input id="edShow" type="checkbox" checked> Handanalyse zeigen</label>
  <div id="edStatus" class="note"></div>
  <div id="edCompare"></div>

  <div id="meta"></div>
</div>
<div id="map"></div>
<script type="module" src="app.js"></script>
</body>
</html>
